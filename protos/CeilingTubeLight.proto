#VRML_SIM R2025a utf8

PROTO CeilingTubeLight [
  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 0 1 0
] {
  Pose {
    translation IS translation
    rotation IS rotation
    children [
      # Webots cylinders are along local Z. Turn the tube to run along the venue X axis.
      Pose {
        rotation 0 1 0 1.57079632679
        children [
          Shape {
            castShadows FALSE
            appearance Appearance {
              material Material {
                diffuseColor 0.90 0.92 0.95
                emissiveColor 0.96 0.98 1
              }
            }
            geometry Cylinder { radius 0.018 height 1.2 subdivision 32 }
          }
          Pose {
            translation 0 0 -0.58
            children [
              DEF TUBE_CAP Shape {
                castShadows FALSE
                appearance Appearance {
                  material Material {
                    diffuseColor 0.45 0.47 0.50
                  }
                }
                geometry Cylinder { radius 0.019 height 0.04 subdivision 32 }
              }
            ]
          }
          Pose {
            translation 0 0 0.58
            children [ USE TUBE_CAP ]
          }
        ]
      }
      # Sample the luminous length with five emitters using inverse-square falloff.
      PointLight {
        location -0.48 0 -0.02
        attenuation 0 0 0.55
        intensity 0.55
        castShadows TRUE
      }
      PointLight {
        location -0.24 0 -0.02
        attenuation 0 0 0.55
        intensity 0.55
        castShadows TRUE
      }
      PointLight {
        location 0 0 -0.02
        attenuation 0 0 0.55
        intensity 0.55
        castShadows TRUE
      }
      PointLight {
        location 0.24 0 -0.02
        attenuation 0 0 0.55
        intensity 0.55
        castShadows TRUE
      }
      PointLight {
        location 0.48 0 -0.02
        attenuation 0 0 0.55
        intensity 0.55
        castShadows TRUE
      }
    ]
  }
}
